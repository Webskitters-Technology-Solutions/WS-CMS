version: 2
updates:
  - package-ecosystem: npm
    directory: /wts-cms
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      nextjs-runtime:
        patterns:
          - next
          - react
          - react-dom
      api-runtime:
        patterns:
          - express
          - express-rate-limit
          - mongoose
          - pino
          - dotenv
      validation-and-editor:
        patterns:
          - zod
          - lucide-react
      test-and-tooling:
        dependency-type: development
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"
